wake_word:
  model_path: "wake_word/crank_otto.onnx"
  threshold: 0.85

stt:
  model_size: "large-v3"
  device: "cpu"
  compute_type: "int8"
  language: "ko"
  initial_prompt: "디지툴, AI Agents, 연세대학교, LearnUs, Notion, Krita, MCP"

vad:
  threshold: 0.3
  tail_ms: 1500
  max_duration_s: 30

llm:
  default_provider: "anthropic"
  default_model: "claude-sonnet-4-6"
  max_tokens: 1000
  history_turns: 10

intent_routing:
  "default": "anthropic/claude-sonnet-4-6"
  "trivial": "anthropic/claude-haiku-4-5"
  "complex_reasoning": "anthropic/claude-opus-4-7"
  "offline_fallback": "ollama/qwen2.5:14b"

tts:
  provider: "elevenlabs"
  model: "eleven_flash_v2_5"
  chunk_size: 1024

filler_threshold_ms: 800

mcp_servers:
  notion:
    command: ["npx", "-y", "@notionhq/notion-mcp-server"]
    env:
      NOTION_TOKEN: "${NOTION_API_KEY}"

tool_use:
  max_iterations: 5
  tool_timeout_s: 15
