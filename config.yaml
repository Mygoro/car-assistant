memory_mode: personal  # personal | exhibition (전시 전날: uv run tools/strip_personal.py → exhibition으로 변경)

wake_word:
  model_path: "wake_word/crank_otto.onnx"
  threshold: 0.85

stt:
  model_size: "large-v3"
  device: "cuda"
  compute_type: "int8_float16"
  language: "ko"
  initial_prompt: "디지툴, AI Agents, 연세대학교, LearnUs, Notion, Krita, MCP"

vad:
  threshold: 0.3
  tail_ms: 1500
  max_duration_s: 30

llm:
  default_provider: "anthropic"
  default_model: "claude-sonnet-4-6"
  max_tokens: 1000
  # D) uncached 히스토리 꼬리 축소로 ITPM 부담 완화 (10→6). history_turns*2개 메시지 유지.
  history_turns: 6

intent_routing:
  "default": "anthropic/claude-sonnet-4-6"
  "trivial": "anthropic/claude-haiku-4-5"
  "complex_reasoning": "anthropic/claude-sonnet-4-6"
  "offline_fallback": "ollama/qwen2.5:14b"

tts:
  provider: "elevenlabs"
  model: "eleven_flash_v2_5"
  chunk_size: 1024

filler_threshold_ms: 800

mcp_servers:
  notion:
    command: ["npx", "-y", "@notionhq/notion-mcp-server"]
    env:
      NOTION_TOKEN: "${NOTION_API_KEY}"
    # B) Notion API 스키마 22개는 매 요청 토큰을 크게 잡아먹는다.
    # Otto가 실제 쓰는 조회 툴만 등록 → ITPM/캐시 write 부담 감소.
    # (전체 툴이 필요하면 이 목록을 비우거나 삭제하면 됨)
    allowed_tools:
      - API-post-search
      - API-query-data-source
      - API-retrieve-a-data-source
      - API-get-block-children
      - API-retrieve-a-page

tool_use:
  max_iterations: 5
  tool_timeout_s: 15
  # C) tool_result 길이 캡. 강의 본문(100블록) 같은 거대 결과가 매 루프 iteration·히스토리에
  # uncached로 재전송되며 ITPM을 터뜨리는 것을 차단. 요약엔 앞부분이면 충분.
  max_result_chars: 6000
