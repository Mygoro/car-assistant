[project]
name = "car-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "discord-ext-voice-recv>=0.5.0",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.18.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "elevenlabs>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "ulid-py>=1.1.0",
    "onnx>=1.21.0",
    "sounddevice>=0.5.5",
    "mcp>=1.27.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.197.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
